[package]
name = "uxo-core"
version = "0.1.0"
edition = "2021"
description = "Memiro AI core domain logic (no GUI dependencies)"

[lib]
name = "uxo_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hound = "3"
thiserror = "1"
ureq = { version = "2", features = ["json"] }
tempfile = "3"
# Декодирование произвольных аудиоформатов (m4a/aac, mp3, flac, ogg, wav…)
# чистым Rust — для импорта записей с телефонов и диктофонов.
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
# Ogg/Opus (голосовые из мессенджеров) — symphonia Opus не декодирует.
# libopus вендорится audiopus_sys и собирается из исходников (cmake).
ogg = { version = "0.9", optional = true }
audiopus = { version = "0.2", optional = true }
whisper-rs = { version = "0.16", optional = true }
# Диаризация (разделение говорящих): pyannote segmentation-3.0 + wespeaker
# ResNet34 через ONNX Runtime (статически линкуется, бинарники ORT качаются при
# сборке). Тяжёлая — только за фичей `diarize`.
# Общая часть; бинарники ORT подключаются по платформам (см. target-секции ниже).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std"] }
# Parakeet (NVIDIA NeMo): модель приходит архивом .tar.bz2 (чистый Rust).
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.6", optional = true }
# Kaldi-совместимые fbank-признаки для модели эмбеддингов голоса.
kaldi-native-fbank = { version = "0.1", optional = true }

[features]
whisper = ["dep:whisper-rs"]
# Декодирование Ogg/Opus (libopus). Тяжёлая C-сборка — отдельно.
opus = ["dep:ogg", "dep:audiopus"]
# Диаризация (разделение говорящих). Тяжёлые ML-зависимости (ONNX Runtime) — отдельно.
diarize = ["dep:ort", "dep:kaldi-native-fbank"]
# Распознавание NVIDIA Parakeet TDT 0.6B v3 (ONNX Runtime): 25 языков, в т.ч.
# русский, пунктуация, в разы быстрее Whisper на CPU, без «галлюцинаций».
parakeet = ["dep:ort", "dep:tar", "dep:bzip2"]
# GPU-ускорение через Vulkan (быстро на NVIDIA/AMD/Intel; рантайм vulkan-1.dll
# идёт с драйвером, ничего вкладывать в установщик не нужно).
gpu = ["whisper", "whisper-rs/vulkan"]
# GPU на Mac (Apple Silicon и Intel с Metal) — Metal вместо Vulkan.
metal = ["whisper", "whisper-rs/metal"]

# Реальный захват звука только на Windows. На Linux/macOS не подтягивается,
# поэтому воркспейс собирается без WASAPI.
[target.'cfg(windows)'.dependencies]
wasapi = "0.15"
# Сырой Win32 для детекта звонка по аудио-сессиям (IAudioSessionManager2).
# Версия совпадает с той, что тянет wasapi 0.15 — без дублирования в дереве.
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
] }

# ONNX Runtime: на Windows/Linux — статические бинарники pyke (API 1.27); на
# macOS — динамически из libonnxruntime.dylib внутри приложения (API 1.23:
# последняя версия ORT, у которой есть сборка для Intel-Mac).
[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-27"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "api-23"] }
# Захват звука на macOS: микрофон (CoreAudio), системный звук — Core Audio tap
# (macOS 14.2+, objc2 для CATapDescription/AVCaptureDevice) или ScreenCaptureKit.
cpal = "0.15"
screencapturekit = "11"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSDictionary", "NSValue", "NSUUID", "NSObject"] }
block2 = "0.6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "diar_eval"
required-features = ["diarize"]

[[example]]
name = "asr_eval"
required-features = ["parakeet"]

[[example]]
name = "noise_eval"
required-features = ["parakeet"]

[[example]]
name = "diar_noise_eval"
required-features = ["diarize"]

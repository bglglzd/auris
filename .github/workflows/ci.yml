name: ci

# Проверки на каждый PR и пуш в main: фронтенд (тесты/типы/сборка), тесты ядра
# на Linux, компиляция тяжёлых фич (whisper) на Windows и сборка macOS
# (Apple Silicon + Intel). Полная GPU-сборка
# (Vulkan) остаётся в release.yml — здесь только быстрые проверки.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Ядро без GUI и тяжёлых фич: модель, хранилище, аудио, расшифровка, ИИ.
      - name: Core tests
        run: cargo test -p uxo-core

  # Компиляция GUI-крейта (src-tauri) с whisper И diarize на Windows. Покрывает
  # uxo-core/whisper + uxo-core/diarize (ONNX Runtime) и команды/lib приложения. Нужен
  # собранный фронтенд: generate_context! встраивает ассеты из ../dist.
  check-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Whisper.cpp (whisper-rs) собирается через bindgen — нужен libclang.
      - name: Install LLVM (libclang for whisper-rs)
        run: choco install llvm -y --no-progress
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      # Полная сборка приложения с whisper + diarize + opus (без GPU/Vulkan):
      # именно build (а не check) — ловит ошибки линковки whisper.cpp и
      # статического ONNX Runtime до релиза. opus тянет libopus (cmake).
      # Через tauri CLI и с NSIS-установщиком — проверяет и хуки установщика
      # (миграция со старого имени). Без артефактов обновления: ключ только в релизе.
      - name: tauri build (app + NSIS installer, whisper + diarize + opus + parakeet)
        run: >-
          npm run tauri build -- --debug --bundles nsis
          --features whisper,diarize,opus,parakeet
          --config src-tauri/tauri.ci.conf.json
      - name: Check installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse target/debug/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $exe.Name

  # Диаризация на Windows по-настоящему: ONNX Runtime + модели + эталонная
  # запись pyannote (2 голоса). Проверяет рантайм там, где живут пользователи.
  onnx-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ONNX tests (unit + e2e on real models)
        run: |
          cargo test -p uxo-core --features diarize,parakeet
          cargo test -p uxo-core --features diarize --test diarize_e2e -- --ignored
          cargo test --release -p uxo-core --features parakeet --test parakeet_e2e -- --ignored

  # macOS: сборка приложения через tauri CLI (он включает macos-private-api для
  # прозрачного окна) + e2e диаризации на ONNX Runtime 1.23.2 (load-dynamic —
  # та же dylib, что уходит в Memiro AI.app). Apple Silicon — с Metal, Intel — CPU.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            features: metal,diarize,opus,parakeet
          - runner: macos-15-intel
            arch: x86_64
            features: whisper,diarize,opus,parakeet
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # screencapturekit → apple-metal собирает Swift-мост под SDK macOS 26
      # (MTLTensor и др.): нужен самый свежий Xcode на раннере. Минимальная
      # версия приложения (macOS 13) от SDK не зависит.
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: ONNX Runtime (macOS dylib)
        run: |
          # cmake — whisper.cpp; autotools — статический libopus (audiopus_sys).
          brew install cmake autoconf automake libtool || true
          autoreconf --version | head -1 && cmake --version | head -1
          scripts/fetch-onnxruntime-macos.sh ${{ matrix.arch }}
          echo "ORT_DYLIB_PATH=$PWD/src-tauri/macos/libonnxruntime.dylib" >> "$GITHUB_ENV"
      - name: Core tests (+ ONNX, diarization e2e)
        run: |
          cargo test -p uxo-core --features diarize,parakeet
          cargo test -p uxo-core --features diarize --test diarize_e2e -- --ignored
      # Подпись самоподписанным сертификатом — тот же путь, что в релизе
      # (с секретами MACOS_CERT_*), здесь — одноразовый сертификат.
      - name: Signing identity (throwaway self-signed)
        run: |
          OUT_DIR="$RUNNER_TEMP/cert" PASSWORD="$(openssl rand -hex 12)" QUIET=1 scripts/make-macos-signing-cert.sh
          P12_BASE64="$(cat "$RUNNER_TEMP/cert/memiro-signing.p12.base64")" \
          P12_PASSWORD="$(cat "$RUNNER_TEMP/cert/memiro-signing.password")" \
            scripts/import-macos-signing-cert.sh
      - name: Build Memiro AI.app (${{ matrix.arch }})
        # Без артефактов обновления: ключ подписи есть только у release.yml.
        run: >-
          npm run tauri build -- --debug --bundles app
          --features ${{ matrix.features }}
          --config src-tauri/tauri.ci.conf.json
      - name: Check bundle
        run: |
          APP=$(find target -maxdepth 5 -type d -path "*bundle/macos/Memiro AI.app" | head -1)
          test -n "$APP"
          test -f "$APP/Contents/Frameworks/libonnxruntime.dylib"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/Memiro"
          codesign -dvv "$APP" 2>&1 | head -12
          # Постоянная подпись: требование привязано к сертификату, а не к хэшу
          # сборки — разрешения macOS переживают обновления.
          codesign -dvv "$APP" 2>&1 | grep -q "Authority=Memiro AI Self-Signed"
          codesign -d -r- "$APP" 2>&1 | tee /dev/stderr | grep -q "certificate leaf"
          codesign --verify --deep --strict "$APP"
